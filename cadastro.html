<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - SneakerX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo"><img src="SneakersX.jpg" alt="Logo" width="80"></div>
        <nav class="menu">
            <a href="index.html">Lançamentos</a>
            <a href="index.html">Marcas</a>
        </nav>
    </header>

    <main class="conteudo-principal">
        <form class="formulario-checkout" action="#" method="POST">
            
            <fieldset>
                <legend>Dados Pessoais</legend>
                <div class="campo-grupo">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="campo-grupo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="campo-grupo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>
                <div class="campo-grupo">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" required>
                </div>
                <div class="campo-grupo">
                    <label for="rua">Rua *</label>
                    <input type="text" id="rua" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Pagamento</legend>
                <label><input type="radio" name="pagamento" required> PIX</label>
                <label><input type="radio" name="pagamento"> Cartão</label>
            </fieldset>

            <br>
            <label><input type="checkbox" required> Aceito os termos</label>
            <br><br>
            <button type="submit" class="btn-enviar-formulario">Concluir Compra</button>
        </form>
    </main>

</body>
</html>
