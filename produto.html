<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produto - SneakerX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo"><img src="SneakersX.jpg" alt="Logo" width="80"></div>
        <nav class="menu">
            <a href="index.html">Lançamentos</a>
            <a href="index.html">Marcas</a>
        </nav>
        <div class="acoes"><a href="carrinho.html">🛒 Carrinho</a></div>
    </header>

    <main class="conteudo-principal">
        <div class="produto-detalhes-container">
            <div class="coluna-galeria">
                <img src="Air jordan 1 high.webp" alt="Produto" class="foto-principal">
                <div class="miniaturas">
                    <img src="Air jordan 1 high.webp" alt="Miniatura" class="thumb">
                </div>
            </div>

            <div class="coluna-info">
                <h1>Air Jordan 1 High</h1>
                <p class="preco-atual">R$ 1.299,90</p>
                
                <label for="tamanho">Tamanho:</label>
                <select id="tamanho">
                    <option>40</option>
                    <option>41</option>
                </select>
                <br><br>
                <a href="carrinho.html" class="btn-adicionar-carrinho">Adicionar ao Carrinho</a>
            </div>
        </div>

        <h2>Especificações Técnicas</h2>
        <table class="tabela-especificacoes">
            <tbody>
                <tr><th scope="row">Marca</th><td>Nike</td></tr>
                <tr><th scope="row">Modelo</th><td>Air Jordan 1</td></tr>
                <tr><th scope="row">Material</th><td>Couro</td></tr>
                <tr><th scope="row">Garantia</th><td>90 dias</td></tr>
                <tr><th scope="row">Origem</th><td>Importado</td></tr>
            </tbody>
        </table>
    </main>

</body>
</html>
